
version: 2

project_name: gxclick-cli

builds:
  - id: gxclick-cli
    main: ./cmd
    binary: gxclick-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "gxclick-cli_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

